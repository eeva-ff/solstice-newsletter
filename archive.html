---
layout: default
title: Archive
permalink: /archive/
---
<div class="archive-page">
  <span class="tag">Product</span>
  <h1>What’s new at Solstice</h1>
  <p class="archive-sub">Every edition, newest first.</p>
  <ul class="archive">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
        <span class="archive-title">{{ post.title }}</span>
        {% if post.summary %}<span class="archive-summary">{{ post.summary }}</span>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
