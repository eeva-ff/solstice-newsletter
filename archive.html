---
layout: default
title: Archive
permalink: /archive/
---
<h1>All issues</h1>
<ul class="archive">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <time>{{ post.date | date: "%-d %b %Y" }}</time>
    {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
